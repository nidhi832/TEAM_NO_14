{% extends "base.html" %}
{% block title %}Register - MPMS{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-md-7 col-lg-5 col-xl-4">
    <div class="zp-auth-card zp-reveal">

      <!-- Brand Logo -->
      <div class="zp-auth-logo">
        <div class="zp-logo-boxes zp-auth-logo-boxes mb-2">
          <div class="zp-logo-box r"></div>
          <div class="zp-logo-box g"></div>
          <div class="zp-logo-box b"></div>
          <div class="zp-logo-box y"></div>
        </div>
        <h2 class="zp-auth-title">Create an account</h2>
        <p class="zp-auth-subtitle">Join your team on MPMS Cloud Workspace</p>
      </div>

      <form method="post">
        <div class="mb-3">
          <label class="form-label" for="name">
            <i class="bi bi-person me-1 text-muted"></i> Full Name
          </label>
          <input class="form-control" id="name" name="name"
                 placeholder="e.g. Srinidhi P" value="{{ name or '' }}" required autofocus>
        </div>

        <div class="mb-3">
          <label class="form-label" for="email">
            <i class="bi bi-envelope me-1 text-muted"></i> Work Email
          </label>
          <input class="form-control" id="email" name="email" type="email"
                 placeholder="name@company.com" value="{{ email or '' }}" required>
        </div>

        <div class="mb-3">
          <label class="form-label" for="password">
            <i class="bi bi-lock me-1 text-muted"></i> Password
          </label>
          <input class="form-control" id="password" name="password"
                 type="password" placeholder="Create a secure password" required>
          <div class="form-text mt-1 text-muted">
            <i class="bi bi-shield-lock text-primary me-1"></i> At least 8 characters, with letters and digits.
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="role">
            <i class="bi bi-person-badge me-1 text-muted"></i> I am a
          </label>
          <select class="form-select" id="role" name="role">
            <option value="Team Member" {{ 'selected' if role != 'PM' }}>Team Member (Execute &amp; update tasks)</option>
            <option value="PM" {{ 'selected' if role == 'PM' }}>Project Manager (Create &amp; lead projects)</option>
          </select>
        </div>

        <div class="d-grid mt-4">
          <button class="btn btn-primary py-2 fw-semibold" type="submit">
            <i class="bi bi-person-check-fill me-1"></i> Register
          </button>
        </div>
      </form>

      <div class="text-center mt-4 pt-3 border-top">
        <span class="text-muted small">Already have an account?</span>
        <a class="small fw-semibold text-primary ms-1 text-decoration-none" href="{{ url_for('auth.login') }}">
          Log in &rarr;
        </a>
      </div>

    </div>
  </div>
</div>
{% endblock %}
