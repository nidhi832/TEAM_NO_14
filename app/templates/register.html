{% extends "base.html" %}
{% block title %}Register - MPMS{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h2 class="mb-3">Create an account</h2>
    <form method="post">
      <div class="mb-3">
        <label class="form-label" for="name">Name</label>
        <input class="form-control" id="name" name="name"
               value="{{ name or '' }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input class="form-control" id="email" name="email" type="email"
               value="{{ email or '' }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" id="password" name="password"
               type="password" required>
        <div class="form-text">At least 8 characters, with letters and digits.</div>
      </div>
      <button class="btn btn-primary" type="submit">Register</button>
      <a class="ms-2" href="{{ url_for('auth.login') }}">Already have an account?</a>
    </form>
  </div>
</div>
{% endblock %}
