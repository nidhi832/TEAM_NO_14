{% extends "base.html" %}
{% block title %}Edit project - MPMS{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
  <h1 class="h3 mb-3">Edit project</h1>
  <form method="post">
    <div class="mb-3"><label class="form-label" for="name">Name</label>
      <input class="form-control" id="name" name="name" value="{{ form.get('name', '') }}" required></div>
    <div class="mb-3"><label class="form-label" for="description">Description</label>
      <textarea class="form-control" id="description" name="description" rows="3">{{ form.get('description', '') }}</textarea></div>
    <div class="row">
      <div class="col mb-3"><label class="form-label" for="start_date">Start date</label>
        <input class="form-control" id="start_date" name="start_date" type="date" value="{{ form.get('start_date', '') }}"></div>
      <div class="col mb-3"><label class="form-label" for="end_date">End date</label>
        <input class="form-control" id="end_date" name="end_date" type="date" value="{{ form.get('end_date', '') }}"></div>
    </div>
    <button class="btn btn-primary" type="submit">Save changes</button>
    <a class="ms-2" href="{{ url_for('projects.show_project', project_id=project.id) }}">Cancel</a>
  </form>
</div></div>
{% endblock %}
